# Quality gates for every push to main and every pull request: the same
# commands each phase must pass locally (CLAUDE.md), then the Playwright
# E2E suite against a local stack (in-memory Mongo replica set, fake IdP).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --maxWorkers=2
      - run: pnpm check:mcp-coverage
      - run: pnpm check:tokens
      - run: pnpm check:i18n
      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e --workers=2

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
