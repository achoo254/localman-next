# /etc/nginx/conf.d/localman.hoandat.com.conf (installed by infra/localman/deploy.sh)
# Template: deploy.sh fills the script-src placeholder with the hashes of the
# inline scripts of the web build it ships (infra/localman/csp-hashes.mjs);
# never install it by hand.
#
#   localman.hoandat.com     Cloudflare proxied: web app (static), dashboard
#                            API, /m/ mock fallback.
#   *.localman.hoandat.com   DNS only: mock runtime {secret}.localman.hoandat.com.
#
# Both use the Let's Encrypt certificate of infra/localman/issue-wildcard-cert.sh
# (valid for Cloudflare SSL "full" and "full (strict)").
# Only $remote_addr is forwarded and X-Forwarded-Host is always this host:
# the API trusts X-Forwarded-* from 127.0.0.1 only (TRUST_PROXY=127.0.0.1)
# and the mock runtime reads the project secret from the host name.
# Zones, the masked log format and the client-IP rules: localman-http.conf.
# Real client IP: the proxied host relies on the Cloudflare real-IP rules at
# http level (deploy.sh warns when they are missing); the DNS-only wildcard
# trusts no forwarded header.

server {
    listen 80;
    listen [::]:80;
    server_name localman.hoandat.com *.localman.hoandat.com;
    # Plain-http mock URLs carry the secret in the host: masked format.
    access_log /var/log/nginx/localman-mock.access.log localman;
    return 301 https://$host$request_uri;
}

# Names reserved for the platform can never be a project secret. Exact names
# win over the wildcard below.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.localman.hoandat.com api.localman.hoandat.com
                app.localman.hoandat.com admin.localman.hoandat.com
                mail.localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    access_log off;
    return 404;
}

# Mock runtime: https://{secret}.localman.hoandat.com{prefix}/...
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    # The format leaves out the host, which carries the secret.
    access_log /var/log/nginx/localman-mock.access.log localman;
    error_log  /var/log/nginx/localman-mock.error.log;

    # DNS only: clients connect directly, so no forwarded header is trusted
    # (CF-Connecting-IP included). Replacing the inherited Cloudflare
    # set_real_ip_from list with UNIX sockets only, which this server never
    # listens on, keeps $remote_addr the TCP peer for the rate limits.
    set_real_ip_from unix:;

    # The API caps JSON bodies at 100 kB.
    client_max_body_size 128k;

    limit_req zone=localman_mock burst=100 nodelay;
    limit_conn localman_mock_conn 50;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# Web app, dashboard API and the /m/ fallback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    access_log /var/log/nginx/localman.hoandat.com.access.log localman;
    error_log  /var/log/nginx/localman.hoandat.com.error.log;

    root /opt/localman/web;
    client_max_body_size 128k;
    limit_req_status 429;
    limit_conn_status 429;

    # Inherited by the proxied locations.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    # Headers of the static web app. Locations with their own add_header do
    # not inherit these, which the proxied ones rely on: the API sets its own
    # security headers (helmet). Static locations use `expires` only, so they
    # keep these headers.
    # script-src: Turnstile plus the inline theme, #app and loader scripts of
    # dist/index.html by hash (no 'unsafe-inline'). style-src needs
    # 'unsafe-inline' for the style attributes of the prerendered landing and
    # the styles Radix injects. img-src https: for IdP profile pictures.
    # form-action: logout is a form POST that redirects to the IdP.
    # connect-src: the app only calls its own origin (/api/, /auth/); the
    # Turnstile widget talks to Cloudflare from its own frame.
    # frame-ancestors 'none' (and X-Frame-Options for old browsers): sites of
    # the same site such as *.tunnel.hoandat.com serve arbitrary user HTML
    # and must not frame the dashboard.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    location /auth/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # Audit events pushed by the IdP (${PUBLIC_URL}/internal/audit-events).
    location /internal/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # Mock fallback https://localman.hoandat.com/m/{secret}{prefix}/...
    location /m/ {
        limit_req zone=localman_mock burst=100 nodelay;
        limit_conn localman_mock_conn 50;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4100;
    }

    # Content-hashed build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Entry points that must never be stale.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /robots.txt {
        expires 1d;
    }

    # SPA: unknown paths render the app, which shows its own 404.
    location / {
        try_files $uri /index.html;
    }
}
