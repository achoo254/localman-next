<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- /invite/:token pages: never send the token to other sites. -->
		<meta name="referrer" content="strict-origin" />
		<title>Localman</title>
		<script>
			// Apply the saved theme before first paint (key: THEME_STORAGE_KEY in src/lib/theme.ts).
			try {
				var theme = localStorage.getItem("localman-theme");
				if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
			} catch (error) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
