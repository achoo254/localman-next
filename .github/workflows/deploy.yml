# Continuous deploy of tunelo-server and localman.hoandat.com, in that order (the cross-repo deploy order). Tunelo:
# the release (infra/tunelo/build-release.sh) goes up as the restricted `tunelo-deploy` user and switches through
# infra/tunelo/activate-incoming.sh (flock, releases/<id>, pm2, /health, rollback; a release whose files equal the
# running one is dropped without a restart, so a Localman-only push keeps every tunnel up).
# Localman: after `ci` passes on a push to main, build the release
# (infra/localman/build-release.sh), upload it as the restricted `localman-deploy` user to
# /opt/localman/ci-incoming/<id> and switch through the one sudo command that user has
# (infra/localman/activate-incoming.sh: flock, server scripts from the release, then activate-release.sh: install,
# tenant indexes, switch, health, previous release back on failure). Building (which runs dependency code) happens in
# a job without the deploy key; the deploy job only downloads the artifact, uploads and activates it.
# The rule for every repo: docs/deploy-standard.md in the hoandat-app workspace.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: release
        name: build release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          # Kept out of the public repository; nginx needs it to let the IdP on the same server reach /internal/.
          SERVER_PUBLIC_IP: ${{ secrets.SERVER_PUBLIC_IP }}
        run: |
          echo "id=$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}" >>"$GITHUB_OUTPUT"
          bash infra/localman/build-release.sh release
          bash infra/tunelo/build-release.sh tunelo-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunelo-release
          path: tunelo-release/
          retention-days: 7

  deploy-tunelo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      TARGET: tunelo-deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tunelo-release
          path: tunelo-release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.TUNELO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r tunelo-release/ "$TARGET:/var/www/tunelo/ci-incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/tunelo-activate-incoming $RELEASE_ID"
      - name: smoke from outside
        run: |
          health="$(curl -fsS https://tunnel.hoandat.com/health)"
          case "$health" in *'"status":"ok"'*) ;; *) echo "tunnel.hoandat.com/health -> $health" >&2; exit 1 ;; esac
      - if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy:
    needs: [build, deploy-tunelo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address and SSH port are secrets so the public repository does not show them.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      TARGET: localman-deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/opt/localman/ci-incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/localman-activate-incoming $RELEASE_ID"
      - name: smoke from outside
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://localman.hoandat.com/)"
          [ "$code" = 200 ] || { echo "https://localman.hoandat.com/ -> $code" >&2; exit 1; }
          served="$(curl -fsS "https://localman.hoandat.com/RELEASE?v=$RELEASE_ID" | tr -d '\r\n')"
          [ "$served" = "$RELEASE_ID" ] || { echo "origin serves '$served', expected $RELEASE_ID" >&2; exit 1; }
      - if: always()
        run: rm -f ~/.ssh/deploy_key
