# Tunelo response-cache — Valkey, cache thuần, bounded, KHÔNG persistence.
# Deploy: /etc/valkey/valkey.conf  (staging .65). Xem
# plans/dattqh/260724-1332-redis-response-cache/phase-01-valkey-provisioning.md
#
# Vì sao bounded + no-persistence: RAM host mỏng (đã từng cạn RAM), cache là dữ
# liệu bỏ đi được. maxmemory chặn trần; tắt RDB/AOF tránh fork() nhân đôi RAM.

bind 127.0.0.1 -::1          # chỉ localhost; Node relay connect nội bộ
protected-mode yes
port 6379

maxmemory 256mb
maxmemory-policy allkeys-lru # cache: đầy thì evict LRU
save ""                      # TẮT RDB snapshot
appendonly no                # TẮT AOF

# Đặt password thật lúc deploy trên server — KHÔNG commit giá trị thật.
requirepass CHANGE_ME_AT_DEPLOY
