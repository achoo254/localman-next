<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<!-- /invite/:token pages: never send the token to other sites. -->
		<meta name="referrer" content="strict-origin" />
		<!-- Landing SEO, in English (the default language; the landing is
		     prerendered in English too). Crawlers and link previews do not run
		     JS, so this copy is static: it is `landing.meta` of
		     src/i18n/messages/en/landing.ts (checked by the landing test). It
		     follows the landing hero while the API client flag is off; switch it
		     to the "localhost" wording in the same change that turns the flag on.
		     No canonical/og:url here: this file serves every SPA route, and a
		     fixed "/" would tell crawlers that /docs pages are the landing. -->
		<title>Localman · Stateful mock REST APIs with relations and Faker</title>
		<meta
			name="description"
			content="Spin up a stateful mock REST API in minutes: declare resources, generate data with Faker.js, nest relations and get CRUD endpoints right away."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Localman" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="zh_CN" />
		<meta property="og:locale:alternate" content="vi_VN" />
		<meta
			property="og:title"
			content="Localman · Stateful mock REST APIs with relations and Faker"
		/>
		<meta
			property="og:description"
			content="Spin up a stateful mock REST API in minutes: declare resources, generate data with Faker.js, nest relations and get CRUD endpoints right away."
		/>
		<!-- AI-drawn 1200×630 preview (public/og-image.jpg); link previews need
		     an absolute URL, so it names the web host (brand.config.json
		     hostTemplates.web, checked by brand-static-files.test.ts). -->
		<meta property="og:image" content="https://localman.hoandat.com/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://localman.hoandat.com/og-image.jpg" />
		<!-- The shared theme script of @achoo254/app-shell sets data-theme
		     before first paint (vite.config.ts puts it here; deploy.sh allows
		     it in the CSP by its hash, src/lib/theme-bootstrap.test.ts). -->
		<!--theme-bootstrap-->
	</head>
	<body>
		<div id="app"></div>
		<script>
			// The build prerenders public pages into #app (this file for "/";
			// src/prerender.tsx), marked with their path. Every other SPA path gets index.html: drop the markup unless
			// it belongs to this path, so other pages do not flash the landing
			// (main.tsx then renders instead of hydrating). Same script in every
			// prerendered file, so the CSP hashes it once (csp-hashes.mjs).
			var app = document.getElementById("app");
			if (location.pathname !== app.getAttribute("data-prerendered")) app.replaceChildren();
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
