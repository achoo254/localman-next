# /etc/nginx/conf.d/localman.hoandat.com.conf
# Template: deploy.sh fills the script-src placeholder with the hashes of the
# inline scripts of the web build it ships (infra/localman/csp-hashes.mjs)
# into releases/<id>/nginx/, and switch-release.sh installs that copy with
# the release; never install this file by hand.
#
#   localman.hoandat.com     Cloudflare proxied: web app (static), dashboard
#                            API, /m/ mock fallback.
#   *.localman.hoandat.com   DNS only: mock runtime {secret}.localman.hoandat.com.
#
# Both use the Let's Encrypt certificate of infra/localman/issue-wildcard-cert.sh
# (valid for Cloudflare SSL "full" and "full (strict)").
# Only $remote_addr is forwarded and X-Forwarded-Host is always this host:
# the API trusts X-Forwarded-* from 127.0.0.1 only (TRUST_PROXY=127.0.0.1)
# and the mock runtime reads the project secret from the host name.
# Zones, the masked log format and the client-IP rules: localman-http.conf.
# Real client IP: the proxied host relies on the Cloudflare real-IP rules at
# http level (deploy.sh warns when they are missing); the DNS-only wildcard
# trusts no forwarded header.

server {
    listen 80;
    listen [::]:80;
    server_name localman.hoandat.com *.localman.hoandat.com;
    # Plain-http mock URLs carry the secret in the host: masked format, and
    # no error lines below crit (they name the host).
    access_log /var/log/nginx/localman-mock.access.log localman;
    error_log  /var/log/nginx/localman-mock.error.log crit;
    return 301 https://$host$request_uri;
}

# Names reserved for the platform can never be a project secret. Exact names
# win over the wildcard below.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.localman.hoandat.com api.localman.hoandat.com
                app.localman.hoandat.com admin.localman.hoandat.com
                mail.localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    access_log off;
    return 404;
}

# Mock runtime: https://{secret}.localman.hoandat.com{prefix}/...
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    # The format leaves out the host, which carries the secret. Error lines
    # always name the host, so only crit and above are written (no 4xx,
    # upstream or limit messages); rate limiting is visible as 429s in the
    # access log.
    access_log /var/log/nginx/localman-mock.access.log localman;
    error_log  /var/log/nginx/localman-mock.error.log crit;

    # DNS only: clients connect directly, so no forwarded header is trusted
    # (CF-Connecting-IP included). Replacing the inherited Cloudflare
    # set_real_ip_from list with UNIX sockets only, which this server never
    # listens on, keeps $remote_addr the TCP peer for the rate limits.
    set_real_ip_from unix:;

    # The API caps JSON bodies at 100 kB.
    client_max_body_size 128k;

    limit_req zone=localman_mock burst=100 nodelay;
    limit_conn localman_mock_conn 50;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Hosted Mock MCP ({prefix}/mcp) streams SSE here too: the MCP SDK sends
    # X-Accel-Buffering: no (nginx stops buffering that response) and a
    # keep-alive comment every 15 s, under the 30 s read timeout.
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# Web app, dashboard API and the /m/ fallback.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localman.hoandat.com;

    ssl_certificate     /etc/letsencrypt/live/localman.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localman.hoandat.com/privkey.pem;

    access_log /var/log/nginx/localman.hoandat.com.access.log localman;
    error_log  /var/log/nginx/localman.hoandat.com.error.log;

    # Through the release symlink (infra/localman/switch-release.sh).
    root /opt/localman/current/web;
    client_max_body_size 128k;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Inherited by the proxied locations.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    # Headers of the static web app. Locations with their own add_header do
    # not inherit these, which the proxied ones rely on: the API sets its own
    # security headers (helmet). Static locations use `expires` only, so they
    # keep these headers.
    # script-src: Turnstile plus the inline theme, #app and loader scripts of
    # dist/index.html by hash (no 'unsafe-inline'). style-src needs
    # 'unsafe-inline' for the style attributes of the prerendered landing and
    # the styles Radix injects. img-src https: for IdP profile pictures,
    # blob: for the API client's image preview (an <img> runs no script).
    # The HTML preview is a srcdoc iframe with sandbox="": no frame-src
    # needed, and the document inherits this policy.
    # form-action: logout is a form POST that redirects to the IdP.
    # connect-src https: http: — the API client sends the user's requests
    # straight from the browser to any API (credentials omitted, CORS
    # decides), falling back to /api/v1/proxy when the browser cannot. The
    # SPA never reloads the CSP between pages, so it is open app-wide;
    # img-src https: already let data out, and frame-ancestors 'none' plus
    # hash-only script-src still stop framing and injected scripts.
    # 'wasm-unsafe-eval': the API client's script sandbox (QuickJS) is
    # WebAssembly, compiled in a worker from 'self'; it allows compiling
    # WebAssembly only, not eval() of JavaScript.
    # No upgrade-insecure-requests: it would silently send the user's
    # http:// requests (and http://localhost) as https://.
    # frame-ancestors 'none' (and X-Frame-Options for old browsers): sites of
    # the same site such as *.tunnel.hoandat.com serve arbitrary user HTML
    # and must not frame the dashboard.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: http:; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # API client tab drafts and history (/api/v1/client/drafts,
    # /client/history…): the API takes up to DRAFT_BODY_LIMIT (1 MiB draft
    # plus 64 KiB, draft-size.ts) on those routes and answers its own JSON
    # 413 past it; 2m leaves it that answer instead of nginx's HTML page.
    # Every other route keeps the 128k above.
    location ^~ /api/v1/client/ {
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # API client proxy (client.sendRequest): a JSON envelope of up to 15 MiB
    # (MAX_PROXY_ENVELOPE_BYTES in packages/shared/src/api-client/limits.ts:
    # a 10 MB body in base64), 16m so the API answers past it with its own
    # 413, and an upstream timeout of up to 120 s. The
    # API refuses guests before reading the body and limits each account;
    # this per-IP zone (localman-http.conf) stops floods of large bodies
    # before nginx buffers them. Responses (up to ~14 MB of JSON) go out
    # unbuffered instead of through temp files.
    location = /api/v1/proxy {
        limit_req zone=localman_proxy burst=20 nodelay;
        client_max_body_size 16m;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    location /auth/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # Localman MCP for AI agents: Streamable HTTP with Bearer tokens of the
    # IdP. Answers may stream (SSE), so no buffering, and a listen stream
    # stays open longer than an API call. Bodies up to the SDK's 4 MB cap.
    # Per-IP rate (zone in localman-http.conf); a burst covers an agent
    # opening its listen streams and listing tools at once.
    location = /mcp {
        limit_req zone=localman_mcp burst=40 nodelay;
        client_max_body_size 4m;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # RFC 9728 metadata of /mcp (and the root form), served by the API.
    location ^~ /.well-known/oauth-protected-resource {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # Audit events pushed by the IdP (${PUBLIC_URL}/internal/audit-events).
    # The IdP runs on this server and calls through Cloudflare, so after the
    # real-IP rules its address is the server's public IPv4.
    # The API client proxy also egresses from that IP (through Cloudflare
    # its address is the same), so the `allow` below cannot tell them apart:
    # every proxied request carries X-Localman-Proxy and is refused here.
    # `return` is one of the directives that are safe inside `if`.
    location /internal/ {
        if ($http_x_localman_proxy) {
            return 403;
        }
        allow 103.72.98.65;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4000;
    }

    # Mock fallback https://localman.hoandat.com/m/{secret}{prefix}/...
    location /m/ {
        # The secret is in the path, and error lines quote the request.
        error_log /var/log/nginx/localman.hoandat.com.error.log crit;
        limit_req zone=localman_mock burst=100 nodelay;
        limit_conn localman_mock_conn 50;
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:4100;
    }

    # Content-hashed build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;

        # nginx 1.20's mime.types has no wasm; without application/wasm the
        # browser refuses streaming compile of the script sandbox (QuickJS).
        location ~ \.wasm$ {
            types { }
            default_type application/wasm;
            expires 1y;
            try_files $uri =404;
        }
    }

    # Entry points that must never be stale.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /robots.txt {
        expires 1d;
    }

    # SPA: unknown paths render the app, which shows its own 404.
    location / {
        try_files $uri /index.html;
    }
}
