# /etc/nginx/sites-available/tunelo
# Tunelo wildcard subdomain proxy config

# Required for WebSocket upgrade — only set "upgrade" when client sends Upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge cache for relayed static responses. Sits in the http context (this file is
# included from the http block, same as `map` above). Cache key includes $host so
# tenant subdomains never collide. Only responses the origin marks cacheable
# (Cache-Control / no Set-Cookie) are stored — no forced caching here.
proxy_cache_path /var/cache/nginx/tunelo levels=1:2 keys_zone=tunelo:50m
                 max_size=5g inactive=1h use_temp_path=off;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name tunnel.inetdev.io.vn *.tunnel.inetdev.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tunnel.inetdev.io.vn *.tunnel.inetdev.io.vn;

    ssl_certificate /etc/letsencrypt/live/tunnel.inetdev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.inetdev.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Shared proxy settings — inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for WS connections (24h)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Control plane (apex host): token verify, device pairing, login page, health.
    # No `proxy_cache` here → never cached (Bearer-authed / dynamic). Keep unbuffered.
    location /api    { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /login  { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /health { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }

    # Relayed tenant traffic + WebSocket upgrades.
    location / {
        proxy_pass http://127.0.0.1:3001;

        # Cache only relayed responses; key on $host to isolate tenants.
        proxy_cache tunelo;
        proxy_cache_key "$scheme://$host$request_uri";
        proxy_cache_methods GET HEAD;

        # Never cache WebSocket upgrades (control channel + browser WS), and
        # never cache/serve-from-cache requests carrying Authorization — tunnels
        # started with `--auth` enforce Basic Auth in the Node relay, so a cached
        # response would be served without re-running that check (auth bypass).
        proxy_cache_bypass $http_upgrade $http_authorization;
        proxy_no_cache     $http_upgrade $http_authorization;

        # Buffering must be on for caching to work. Streaming responses
        # (SSE / chunked) carry `X-Accel-Buffering: no` from the tunnel server,
        # which makes nginx stream them through and skip the cache per-response.
        proxy_buffering on;

        # Expose HIT / MISS / BYPASS for verification and debugging.
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
