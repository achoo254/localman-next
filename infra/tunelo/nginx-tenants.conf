# /etc/nginx/conf.d/tunelo-tenants.conf
# tunnel.<domain> and *.tunnel.<domain> of every tenant (domains claimed at
# the IdP) -> Tunelo on 127.0.0.1:3001, which picks the tenant from the
# Host header (421 for a domain that is not one). Needs the IdP's
# 00-tenants-http.conf (the $tenant_cert map picks each tenant's
# certificate by SNI) and $connection_upgrade from tunelo.conf; port 80 of
# these hosts is the IdP's tenants-acme.conf. tunnel.hoandat.com keeps its
# own block in tunelo.conf: exact and wildcard names win over this regex.
# Install only once Tunelo has IDP_INTERNAL_URL (docs/tunelo/deployment-guide.md).

# Query strings are never logged: OAuth code/state of the console sign-in,
# login request ids and whatever the tunneled apps put there.
map $request_uri $tunelo_tenant_logged_uri {
    ~^(?<tunelo_path>[^?]*)\?    $tunelo_path?[redacted];
    default            $request_uri;
}

log_format tunelo_tenants '$remote_addr - [$time_local] $host "$request_method $tunelo_tenant_logged_uri" '
                          '$status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?:[a-z0-9-]+\.)?tunnel\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/tunelo-tenants.access.log tunelo_tenants;
    error_log  /var/log/nginx/tunelo-tenants.error.log;

    # Client IP: the visitor, as Cloudflare names it (proxied hosts) or as
    # the IdP's port-80 hop passes it over loopback (Flexible). Declared here
    # so the rate limits and logs do not depend on another app's http-level
    # real-IP setup; a server-level list replaces the inherited one. Ranges:
    # https://www.cloudflare.com/ips-v4 and ips-v6, the same list as
    # auth-next/src/tenants/cloudflare-ips.ts (scripts/nginx-real-ip keeps
    # every tenant block on it).
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;


    # The certificate was picked by SNI, the tenant is picked by Host: a
    # Host that is not the TLS name never reaches Tunelo.
    if ($host != $ssl_server_name) {
        return 421;
    }

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for WS connections (24h)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
}
