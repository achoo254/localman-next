# /etc/nginx/conf.d/localman-http.conf (installed with each release by
# infra/localman/switch-release.sh)
# http-level pieces of Localman. conf.d files are included inside `http {}`
# in alphabetical order, so this file loads before localman.hoandat.com.conf,
# which uses the zones, the map and the log format below.
#
# Client IP. localman.hoandat.com is proxied by Cloudflare: the real-IP rules
# (set_real_ip_from <Cloudflare ranges> + real_ip_header CF-Connecting-IP)
# already live at http level on this server, as auth.hoandat.com relies on,
# and are not repeated here (a second real_ip_header at http level is an
# error); deploy.sh warns when they are missing. The DNS-only
# *.localman.hoandat.com trusts no forwarded header at all (its server block
# overrides set_real_ip_from), so $remote_addr is the TCP peer there.

# Mock runtime ({secret}.localman.hoandat.com and /m/): per client IP, before
# Node. Looser than the API's own limit (MOCK_RATE_LIMIT_PER_IP, 30/s), which
# answers 429 with Retry-After; this one stops mass secret probing.
limit_req_zone $binary_remote_addr zone=localman_mock:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=localman_mock_conn:10m;

# Localman MCP (/mcp): per client IP, before Node verifies the Bearer token
# (a JWKS check and a Mongo hit per request). The API also limits each IdP
# subject (localmanMcpRateLimit, 120 requests a minute) with 429 and
# Retry-After; this one stops floods of bad or many tokens from one address.
limit_req_zone $binary_remote_addr zone=localman_mcp:10m rate=10r/s;

# API client proxy (/api/v1/proxy): per client IP, before nginx buffers an
# envelope of up to 16 MB. The API limits each account (proxyRateLimit, 120
# a minute) and counts the plan's monthly proxy requests; this one only
# stops one address from flooding the server with large bodies.
limit_req_zone $binary_remote_addr zone=localman_proxy:10m rate=5r/s;

# Collections, environments and workspaces (/api/v1/{collections,
# environments,workspaces}/...): per client IP, before nginx buffers bodies
# of up to 16 MB. Autosave sends a write every pause in typing, so the rate
# is loose; it only stops one address from flooding large bodies.
limit_req_zone $binary_remote_addr zone=localman_api_large:10m rate=10r/s;

# Public sharing reads (/api/v1/public/...: public links, the JSON of an
# access key): per client IP, before Node. The API limits each address and
# each key too (publicSharingRateLimit) with 429; this one stops one address
# from guessing link ids or keys at line rate.
limit_req_zone $binary_remote_addr zone=localman_public:10m rate=5r/s;

# Access log without secrets. The mock secret in /m/{secret}, the invitation
# token in /invite/{token} and the ids of public links, guest links and Run
# buttons (/public/c/{id}, /guest/{id}, /run/{id} and their API paths, the
# access key of /api/v1/public/collections/...?access_key=) are masked, and
# every query string is dropped: it can carry the OIDC code and state
# (/auth/callback), an invite path in returnTo
# (/auth/login?returnTo=%2Finvite%2F...) or a ?token=.
# The format logs neither the host (mock secret) nor the Referer.
map $request_uri $localman_logged_uri {
    "~^/m/[^/?]+(?<localman_rest>[^?]*)"  "/m/[secret]$localman_rest";
    "~^/invite/"                          "/invite/[redacted]";
    "~*^/(?<localman_page>public/c|guest|run)/"  "/$localman_page/[redacted]";
    "~*^/api/v1/(?<localman_shared>public/links|public/collections|guest-links|run-buttons)/"  "/api/v1/$localman_shared/[redacted]";
    "~^(?<localman_path>[^?]*)\?"         "$localman_path?[redacted]";
    default                               $request_uri;
}

log_format localman '$remote_addr - [$time_local] "$request_method $localman_logged_uri" '
                    '$status $body_bytes_sent "$http_user_agent" $request_time';
