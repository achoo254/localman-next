# /etc/nginx/sites-available/tunelo
# Tunelo wildcard subdomain proxy config

# Required for WebSocket upgrade — only set "upgrade" when client sends Upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Caching now lives in the Node relay (Valkey-backed): it owns the FE-asset vs
# API classification, guarantees API bypass, and can purge per-subdomain on
# tunnel restart — none of which stock nginx can do. nginx here is a pure
# TLS-terminating proxy; the relay emits `X-Tunelo-Cache: HIT/MISS/BYPASS`.

# Requests still arriving on the old domain, by host: when this log stays
# empty, the old domain can be removed (docs/tunelo/deployment-guide.md).
log_format tunnel_old_domain '$time_local $host "$request" $status $remote_addr';

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name tunnel.hoandat.com *.tunnel.hoandat.com tunnel.inetdev.io.vn *.tunnel.inetdev.io.vn;
    return 301 https://$host$request_uri;
}

# Primary domain (first in TUNNEL_DOMAINS). Wildcard cert from
# certbot --dns-cloudflare, see certbot-setup.sh.
server {
    listen 443 ssl;
    server_name tunnel.hoandat.com *.tunnel.hoandat.com;

    ssl_certificate /etc/letsencrypt/live/tunnel.hoandat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.hoandat.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Shared proxy settings — inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for WS connections (24h)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Control plane (apex host): token verify, device pairing, login page, health.
    # No `proxy_cache` here → never cached (Bearer-authed / dynamic). Keep unbuffered.
    location /api    { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /login  { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /health { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }

    # Relayed tenant traffic + WebSocket upgrades. Stream straight through — the
    # Node relay decides what to cache (in Valkey) and streams SSE/chunked live.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
}

# OneMail dev tunnel (`tunelo http 8011 -s mail`): workspace-application uses
# https://mail.tunnel.inetdev.io.vn as its origin (cookies, passkeys, WOPI), so
# this one name stays when the rest of tunnel.inetdev.io.vn is removed. Own DNS
# record, own cert; Host passes through unchanged, so tunnel.inetdev.io.vn must
# stay in TUNNEL_DOMAINS.
server {
    listen 80;
    server_name mail.tunnel.inetdev.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mail.tunnel.inetdev.io.vn;

    ssl_certificate /etc/letsencrypt/live/mail.tunnel.inetdev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.tunnel.inetdev.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Shared proxy settings — inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for WS connections (24h)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Control plane (apex host): token verify, device pairing, login page, health.
    # No `proxy_cache` here → never cached (Bearer-authed / dynamic). Keep unbuffered.
    location /api    { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /login  { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /health { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }

    # Relayed tenant traffic + WebSocket upgrades. Stream straight through — the
    # Node relay decides what to cache (in Valkey) and streams SSE/chunked live.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
}

# Old domain, still accepted while tunnels and proxies move to the primary
# one. Same settings as above with its own cert; delete this block, its
# names in the port 80 block and its TUNNEL_DOMAINS entry together.
server {
    listen 443 ssl;
    server_name tunnel.inetdev.io.vn *.tunnel.inetdev.io.vn;

    ssl_certificate /etc/letsencrypt/live/tunnel.inetdev.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.inetdev.io.vn/privkey.pem;
    access_log /var/log/nginx/tunnel-old-domain.access.log tunnel_old_domain;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Shared proxy settings — inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for WS connections (24h)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Control plane (apex host): token verify, device pairing, login page, health.
    # No `proxy_cache` here → never cached (Bearer-authed / dynamic). Keep unbuffered.
    location /api    { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /login  { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }
    location /health { proxy_pass http://127.0.0.1:3001; proxy_buffering off; }

    # Relayed tenant traffic + WebSocket upgrades. Stream straight through — the
    # Node relay decides what to cache (in Valkey) and streams SSE/chunked live.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
}
