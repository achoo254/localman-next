# /etc/nginx/conf.d/localman-tenants.conf
# Template like localman.hoandat.com.conf: deploy.sh fills the script-src
# placeholder, switch-release.sh installs it only once the IdP's
# 00-tenants-http.conf is there (its $tenant_cert map picks each tenant's
# certificate by SNI, issued by the IdP's provisioner) and Localman's env
# serves other tenants (IDP_INTERNAL_URL). See
# docs/decisions/0003-tenant-scoped-data.md.
#
#   localman.<domain>          web app, dashboard API, /m/ mock fallback;
#   <secret>.localman.<domain> mock runtime.
#
# localman.hoandat.com and *.localman.hoandat.com keep their own blocks:
# exact and wildcard names always win over these regex names. Port 80 of
# every tenant host is served by the IdP's tenants-acme.conf. The API picks
# the tenant from the Host header (421 for a domain that is not one).

# Names reserved for the platform can never be a project secret. Regex
# server names are tried in order: this block comes before the mock one.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?:www|api|app|admin|mail)\.localman\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    access_log off;
    return 404;
}

# Mock runtime: https://{secret}.localman.<domain>{prefix}/...
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^[a-z0-9-]+\.localman\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    # The certificate was picked by SNI, the tenant is picked by Host: a
    # Host that is not the TLS name is refused before reaching the API (no
    # IdP lookup for names made up behind a valid certificate).
    if ($host != $ssl_server_name) {
        return 421;
    }

    # As *.localman.hoandat.com: no host (the secret) in the access log,
    # errors only from crit, no forwarded header trusted.
    access_log /var/log/nginx/localman-mock.access.log localman;
    error_log  /var/log/nginx/localman-mock.error.log crit;
    set_real_ip_from unix:;

    client_max_body_size 128k;

    limit_req zone=localman_mock burst=100 nodelay;
    limit_conn localman_mock_conn 50;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# Web app, dashboard API and the /m/ fallback of localman.<domain>.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^localman\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    access_log /var/log/nginx/localman-tenants.access.log localman;
    error_log  /var/log/nginx/localman-tenants.error.log;

    # Host must be the TLS name, as in the mock block above.
    if ($host != $ssl_server_name) {
        return 421;
    }

    # The headers of localman.hoandat.com (see the reasons there), with
    # this tenant's IdP as the logout form's target.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: http:; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.$tenant; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The IdP pushes every tenant's audit events to localman.hoandat.com.
    location /internal/ {
        return 404;
    }

    include /etc/nginx/localman/localman-app.inc;
}
